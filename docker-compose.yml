# One-command local run:  cp .env.example .env  &&  docker compose up --build
# Open http://localhost:3000   (API on :8000)
services:
  backend:
    build: ./backend
    env_file: [.env]
    environment:
      DATABASE_URL: sqlite+aiosqlite:////data/scamkhel.db
      FRONTEND_ORIGIN: http://localhost:3000
    volumes:
      - scamkhel-data:/data
    ports: ["8000:8000"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000
    depends_on:
      backend:
        condition: service_healthy
    ports: ["3000:3000"]
    restart: unless-stopped
volumes:
  scamkhel-data:
