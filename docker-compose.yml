# One-command local run:  cp .env.example .env  &&  docker compose up --build
# Open http://localhost:3000   (API on :8000)
services:
  backend:
    build: ./backend
    env_file: [.env]
    environment:
      DATABASE_URL: sqlite+aiosqlite:////data/scamkhel.db
      FRONTEND_ORIGIN: http://localhost:3000
    volumes:
      - scamkhel-data:/data
    ports: ["8000:8000"]
    restart: unless-stopped
  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000
        # Demo only (needed for ?client=demo-client-0001). Never set this for real users.
        NEXT_PUBLIC_ALLOW_CLIENT_PARAM: ${NEXT_PUBLIC_ALLOW_CLIENT_PARAM:-}
    depends_on: [backend]
    ports: ["3000:3000"]
    restart: unless-stopped
volumes:
  scamkhel-data:
