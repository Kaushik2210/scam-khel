# Synthetic labelled dialogues. All agencies, names, numbers are FICTIONAL.
# label: scam | legit.  payment_turn: 0-based index of first explicit payment demand (scams).
# speaker "caller" = the other party (scored); "victim" = the user (not scored).

- id: scam-01-digital-arrest-parcel-en
  label: scam
  language: en
  scenario: digital-arrest-parcel
  payment_turn: 8
  turns:
    - {s: caller, t: "This is Inspector Rao from the National Crime Verification Cell (SIMULATION). A parcel booked in your name was seized by customs."}
    - {s: victim, t: "What parcel? I did not send anything."}
    - {s: caller, t: "It contains illegal items and your Aadhaar is linked to the case. Case number NCV-48213 has been registered against you."}
    - {s: victim, t: "I am scared. What should I do?"}
    - {s: caller, t: "You are under digital arrest from this moment. Keep your camera on and do not disconnect the video call."}
    - {s: victim, t: "Can I tell my son?"}
    - {s: caller, t: "Do not tell anyone, not your family, not your neighbours. This case is confidential."}
    - {s: victim, t: "Okay."}
    - {s: caller, t: "To prove your innocence, transfer Rs 2,40,000 to the RBI safe account immediately. It will be refunded after verification."}

