    - {s: victim, t: "Okay, what do I do?"}
    - {s: caller, t: "Please install AnyDesk from the store and read me the nine digit code on screen."}
    - {s: caller, t: "Now share the OTP that arrived and transfer Rs 1 to the account I will send to activate the refund."}

