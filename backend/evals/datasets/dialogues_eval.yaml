# Held-out eval dialogues, written AFTER the rules were tuned on dialogues_p1.yaml, with more
# paraphrase and harder legit cases. All agencies/names/numbers are fictional.
# payment_turn: 0-based index of first explicit payment demand (scams).

- id: ev-scam-01-mumbai-cyber-sim
  label: scam
  language: en
  scenario: sim-misuse
  payment_turn: 4
  turns:
    - {s: caller, t: "Sir, I am calling from the Mumbai Cyber Police desk (SIMULATION). A SIM card issued on your ID was used to send threatening messages."}
    - {s: victim, t: "That cannot be true."}
    - {s: caller, t: "We need to verify you. Stay on this video call until my senior officer joins."}
    - {s: victim, t: "How long will it take?"}
    - {s: caller, t: "Do not discuss this with relatives, it is an ongoing investigation. To prove your savings are clean, move them to the RBI supervised verification account today."}

- id: ev-scam-02-ed-notice
  label: scam
  language: en
  scenario: ed-notice
  payment_turn: 3
  turns:
    - {s: caller, t: "Enforcement Directorate verification cell (SIMULATION). Your PAN is attached to a hawala case, case ref ED-55821."}
    - {s: victim, t: "I have done nothing wrong."}
    - {s: caller, t: "Then co-operate. Do not tell anyone, not even your lawyer, or we will have to arrest you tonight."}
    - {s: caller, t: "Transfer Rs 4,20,000 to the secure account we give you, it will be returned after the audit."}

- id: ev-scam-03-courier-hinglish
  label: scam
  language: hinglish
  scenario: courier-drug-package
  payment_turn: 4
  turns:
    - {s: caller, t: "Hello, courier company se bol rahe hain. Aapke naam ka parcel Mumbai airport par roka gaya hai, usme MDMA mila hai."}
    - {s: victim, t: "Kya? Maine kuch nahi bheja."}
    - {s: caller, t: "Cyber crime police se baat karwata hoon. Aap video call par rahiye, call kaatna mat."}
    - {s: victim, t: "Theek hai."}
    - {s: caller, t: "Case close karne ke liye abhi 85,000 rupay is account mein transfer karo, warna giraftari hogi."}

- id: ev-scam-04-income-tax-hindi
  label: scam
  language: hi
  scenario: income-tax
  payment_turn: 3
  turns:
    - {s: caller, t: "मैं आयकर विभाग से अधिकारी बोल रहा हूँ (SIMULATION)। आपके खाते में बड़ी चोरी पकड़ी गई है, वारंट जारी होने वाला है।"}
    - {s: victim, t: "मुझे कुछ पता नहीं।"}
    - {s: caller, t: "किसी को मत बताइए और अपना आधार नंबर भेजिए।"}
    - {s: caller, t: "तुरंत 70,000 रुपये जुर्माना जमा करें वरना गिरफ्तारी होगी।"}

