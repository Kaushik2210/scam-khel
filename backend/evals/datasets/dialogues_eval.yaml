    - {s: caller, t: "Is link par click kijiye http://bill-fix.example.test/pay aur turant 4,500 rupay transfer karo."}

- id: ev-scam-06-remote-refund
  label: scam
  language: en
  scenario: refund
  payment_turn: 3
  turns:
