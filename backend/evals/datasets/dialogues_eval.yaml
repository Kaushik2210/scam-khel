- id: ev-legit-01-police-complaint-ack
  label: legit
  language: en
  scenario: police-ack
  turns:
    - {s: caller, t: "Good morning, this is the cyber police station. We have registered your complaint about the lost wallet. Your complaint number is 2291."}
    - {s: victim, t: "Thank you, what next?"}
    - {s: caller, t: "Please visit the station with your ID proof at your convenience this week and meet the duty officer."}

