[project]
name = "scam-khel-backend"
version = "0.1.0"
description = "SCAM-KHEL: family shield against digital-arrest scams (Nebius Token Factory + NVIDIA Nemotron)"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "pydantic>=2.6",
  "pydantic-settings>=2.2",
  "openai>=1.30",
  "httpx>=0.27",
  "structlog>=24.1",
  "sqlalchemy[asyncio]>=2.0",
  "aiosqlite>=0.20",
  "alembic>=1.13",
  "cryptography>=42",
  "tavily-python>=0.3",
  "reportlab>=4.1",
  "pyyaml>=6",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.23",
  "respx>=0.21",
  "ruff>=0.4",
  "mypy>=1.10",
  "types-PyYAML",
  "pip-audit",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = ["live: hits the real Token Factory API (skipped without NEBIUS_API_KEY)"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["S101", "E501"]  # formatter owns line length; long regex/prose lines are fine

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S"]
"app/detect/rules.py" = ["E501"]  # regex tables

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]
